<!DOCTYPE html>
<html lang="uk">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Дія</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

        .base-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #content-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; justify-content: center; align-items: center;
        }

        .btn-enter { background: #fff; color: #000; border: none; padding: 16px 60px; font-size: 18px; font-weight: 600; border-radius: 12px; }

        .doc-container {
            width: 100%; height: 100%;
            display: flex; justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
            perspective: 2000px;
        }

        .card {
            width: 82%; 
            max-width: 320px;
            aspect-ratio: 345 / 505;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.2, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        .card.flipped { transform: rotateY(180deg); }

        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 25px;
            overflow: hidden;
            background: #fff;
        }

        .face img { width: 100%; height: 100%; object-fit: contain; }
        .back { transform: rotateY(180deg); }

        .video-box {
            position: absolute;
            top: 65.4%; left: 0; width: 100%; height: 34px;
            overflow: hidden;
            pointer-events: none;
            z-index: 20;
            /* Важливо для мобілок */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .screen img { width: 100%; height: 100%; object-fit: cover; }

        .active-flex { display: flex !important; }
        .active { display: block !important; }

        .nav-overlay { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; z-index: 100; display: flex; }
        .nav-item { flex: 1; height: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <img src="background.png" class="base-layer">

    <div id="login-screen">
        <button class="btn-enter" onclick="initApp()">Увійти</button>
    </div>

    <div id="content-layer">
        <div id="view-docs" class="doc-container screen">
            <div class="card" id="main-card" onclick="flipCard()">
                <div class="face front">
                    <img src="passport.png">
                    <div class="video-box" id="ticker-container">
                        <video id="ticker" playsinline loop muted>
                            <source src="background.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
                <div class="face back">
                    <img src="qrcode.png">
                </div>
            </div>
        </div>

        <div id="view-news" class="screen"><img src="news.png"></div>
        <div id="view-services" class="screen"><img src="services.png"></div>
        <div id="view-menu" class="screen"><img src="menu.png"></div>
    </div>

    <nav class="nav-overlay hidden" id="menu-bar">
        <div class="nav-item" onclick="show('news')"></div>
        <div class="nav-item" onclick="show('docs')"></div>
        <div class="nav-item" onclick="show('services')"></div>
        <div class="nav-item" onclick="show('menu')"></div>
    </nav>

    <script>
        const card = document.getElementById('main-card');
        const tickerContainer = document.getElementById('ticker-container');
        const v = document.getElementById('ticker');

        function initApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('content-layer').style.display = 'block';
            document.getElementById('menu-bar').classList.remove('hidden');
            v.play();
            show('docs');
        }

        function flipCard() {
            if (card.classList.contains('flipped')) {
                // Повертаємо на лицьову сторону
                card.classList.remove('flipped');
                // Чекаємо завершення анімації (0.6с) і вмикаємо відео
                setTimeout(() => {
                    tickerContainer.style.display = 'block';
                }, 300); 
            } else {
                // Перевертаємо на QR - МИТТЄВО видаляємо відео з DOM дерева
                tickerContainer.style.display = 'none';
                card.classList.add('flipped');
            }
        }

        function show(screenId) {
            const screens = ['view-news', 'view-docs', 'view-services', 'view-menu'];
            screens.forEach(s => document.getElementById(s).classList.remove('active', 'active-flex'));
            const target = document.getElementById('view-' + screenId);
            if (screenId === 'docs') target.classList.add('active-flex');
            else target.classList.add('active');
        }
    </script>
</body>
</html>
